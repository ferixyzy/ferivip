<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FERICOD // Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body class="flex items-center justify-center p-4">
  <main class="w-full max-w-md">
    <div class="text-center mb-6">
      <h1 class="font-display text-4xl font-black text-blood glitch tracking-widest">FERICOD</h1>
      <p class="text-xs text-zinc-500 mt-2">&gt; secure access terminal<span class="blink">_</span></p>
    </div>

    <form id="f" class="card p-6 space-y-4 shadow-glow">
      <h2 class="font-display text-lg tracking-widest">SIGN IN</h2>
      <div>
        <label class="text-xs text-zinc-400">EMAIL</label>
        <input id="email" type="email" required class="inp mt-1" placeholder="you@mail.com" autocomplete="email" />
      </div>
      <div>
        <label class="text-xs text-zinc-400">PASSWORD</label>
        <input id="password" type="password" required class="inp mt-1" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div>
        <label class="text-xs text-zinc-400">KODE RAHASIA</label>
        <input id="code" type="password" required class="inp mt-1" placeholder="access code" autocomplete="off" />
      </div>
      <p id="err" class="text-xs text-blood-light hidden"></p>
      <button id="btn" class="btn w-full">Masuk</button>
      <p class="text-xs text-center text-zinc-500">
        Belum punya akun? <a href="/signup" class="text-blood-light hover:underline">Sign Up</a>
      </p>
    </form>
  </main>

  <script src="/assets/app.js"></script>
  <script>
    if (Auth.token) location.replace('/dashboard');
    const f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('btn');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.classList.add('hidden');
      btn.disabled = true; btn.textContent = 'Memeriksa...';
      const { ok, data } = await api('/api/signin', {
        method: 'POST',
        body: { email: email.value, password: password.value, code: code.value },
      });
      if (ok && data.success) {
        Auth.save(data.token, data.email);
        location.href = '/dashboard';
      } else {
        err.textContent = '! ' + (data.message || 'Gagal masuk');
        err.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
